# ==============================================================================
# EMS Platform: Nginx Production Virtual Host Configuration
# Target path on Ubuntu: /etc/nginx/sites-available/ems
# ==============================================================================

# Rate limiting zone for ingress protection
limit_req_zone $binary_remote_addr zone=ems_req_limit:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ems.local stand.ems.local;

    # Local monitoring / health check probe over HTTP
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Redirect all other plain HTTP traffic to HTTPS (301 Permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name ems.local stand.ems.local;

    # TLS Certificate & Private Key
    ssl_certificate /etc/ssl/certs/ems-web.crt;
    ssl_certificate_key /etc/ssl/private/ems-web.key;

    # Modern TLS configuration (TLS 1.2 & 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers (NFR-002, NFR-006)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;

    # Request limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Dedicated health check endpoint
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Static assets caching (immutable build artifacts)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main Application Ingress Proxy
    location / {
        limit_req zone=ems_req_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Controlled Ingress Headers (Trusted Proxy Boundary)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Operational Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
